[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "las-cafiisica"
version = "0.1.3.dev0"
description = "Desktop LAS/LAZ inspection foundation for LAS-CAFIISICA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "laspy[lazrs]>=2.5",
  "pyproj>=3.7",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pyinstaller>=6.11",
]

[project.scripts]
las-cafiisica = "las_classifier.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
